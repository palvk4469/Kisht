# Runs beside another project on a small server: memory is capped, the database is
# private, and only the web app joins the network of the Caddy that holds 80 and 443.
name: kisht

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=25"]
    mem_limit: 192m
    environment:
      POSTGRES_USER: kisht
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: kisht
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisht -d kisht"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: kisht-api:latest
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_OPTIONS: --max-old-space-size=180
      DATABASE_URL: postgresql://kisht:${POSTGRES_PASSWORD:?}@db:5432/kisht
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
      DEMO_MODE: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_DRAFT_MODEL: ${AI_DRAFT_MODEL:-}
      TZ: Asia/Kolkata
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: kisht-web:latest
    restart: unless-stopped
    mem_limit: 192m
    depends_on:
      - api
    environment:
      NODE_OPTIONS: --max-old-space-size=128
    networks:
      default:
      caddy:
        aliases:
          - kisht-web

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:?}

volumes:
  pgdata:
