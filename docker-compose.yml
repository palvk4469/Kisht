services:
  postgres:
    image: postgres:16
    container_name: kisht-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kisht
      POSTGRES_PASSWORD: kisht
      POSTGRES_DB: kisht
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisht -d kisht"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
